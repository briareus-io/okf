manifest_version: 1
description: OKF product documentation and executable showcase of CLI and plugin workflows.
settings:
  lint:
    source_unrecorded: off
  views:
    commands:
      columns:
      - $id
      - title
      - group
      - mutates
      - description
    guides:
      columns:
      - $id
      - title
      - audience
      - description
      expand:
      - uses
  query_presets:
    writing-commands:
      description: Commands whose schema declares authored mutations.
      operations: [search, list]
      query:
        type: Command
        facet_filter: ["mutates=true"]
    user-guides:
      description: Task guides intended for users.
      operations: [search, list]
      query:
        type: Guide
        field: ["audience=user"]
    guides-using-command:
      description: Guides that declare use of the selected command.
      operations: [backlinks]
      filters:
        kind: [uses]
        related_type: [Guide]
      details: true
guidance:
  instructions: |
    This bundle is product documentation and a runnable showcase. Keep documented examples
    consistent with the CLI schema and preserve source attribution. Command pages and CLI
    references are generated by cargo xtask docs; edit their sources rather than their
    generated sections. Preserve curated index prose when updating navigation.
  rules:
    - id: inspect-relationship-evidence
      description: Interpret documentation relationships using their authored semantics.
      operations: [links, backlinks, graph]
      instructions: |
        A uses relationship records a guide or skill's declared command use; it is not proof
        that every command flag or behavior is tested. Consult executable checks for coverage.
workflows:
  check-documentation:
    description: Check manifest, knowledge conformance, lint, and available executable examples.
    instructions_file: .okf-bundle/workflows/check-documentation.md
    outputs:
      - Validation profile and manifest/lint results.
      - Executed example and generated-reference checks, or explicit unavailable checks.
