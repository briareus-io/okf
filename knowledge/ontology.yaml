okf_ontology: '0.1'
concepts:
  Command:
    description: A CLI verb exposed by the okf binary.
    fields:
      group:
        type: string
        required: true
      mutates:
        type: bool
        required: true
  DesignDecision:
    description: A consequential choice with alternatives and reconsideration criteria.
    fields:
      decision_status:
        type: enum
        values:
        - accepted
        - superseded
      audience:
        type: enum
        values:
        - user
        - contributor
    references:
      explains:
        target: Topic
        cardinality: 0..n
    relationships:
      explains:
        reference: explains
        kind: constrains
        inverse: constrained-by
        kinds: {}
        attributes: {}
  Skill:
    description: An agent skill that drives the okf CLI to do judgment work.
    fields:
      trigger:
        type: string
    references:
      uses:
        target: Command
        cardinality: 0..n
    relationships:
      uses:
        reference: uses
        kind: uses
        inverse: used-by
        kinds: {}
        attributes: {}
  Guide:
    description: A task guide with commands and underlying explanations.
    fields:
      audience:
        type: enum
        values:
        - user
        - contributor
    references:
      uses:
        target: Command
        cardinality: 0..n
      explains:
        target: Topic
        cardinality: 0..n
    relationships:
      uses:
        reference: uses
        kind: uses
        inverse: used-by
        kinds: {}
        attributes: {}
      explains:
        reference: explains
        kind: explains
        inverse: explained-by
        kinds: {}
        attributes: {}
  Topic:
    description: A user-facing explanation of the knowledge model.
    fields:
      audience:
        type: enum
        values:
        - user
        - contributor
  Reference:
    description: Exact shared behavior or contributor reference material.
    fields:
      audience:
        type: enum
        values:
        - user
        - contributor
