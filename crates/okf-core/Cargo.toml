[package]
name = "okf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic OKF harness logic (the hands)."

[dependencies]
# Front-loaded so later waves (graph/check/mutate/render/fingerprint/ontology) never churn deps.
# Git is NOT a library dependency — okf-core shells out to the `git` CLI via ports::git.
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
indexmap.workspace = true
thiserror = "2"
sha2 = "0.11"
ignore = "0.4"
globset = "0.4"
regex = "1"
pulldown-cmark = "0.13"
toml.workspace = true

# Network fingerprints (`url` source kind) — optional, gated behind `url-sources`.
ureq = { version = "3", optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
url-sources = ["dep:ureq"]   # network fingerprints for the `url` source kind

[lints]
workspace = true
